# Environment for assembly QC and the summary script.
#   quast  - assembly metrics (contigs, N50, length, GC%)
#   pandas - used by scripts/make_summary_table.py
#
# Python is pinned to <3.12: QUAST (through 5.3.x) imports the standard-library
# module `distutils`, which was removed in Python 3.12. Without this pin, conda
# installs Python 3.12+ and QUAST fails with "No module named 'distutils'".
#
# CheckM2 is NOT in this environment. QUAST needs python<3.12 while CheckM2
# needs python<3.9 or >3.12 - the two cannot share an environment. CheckM2
# lives in envs/checkm2.yaml; the checkm2_qc rule uses that file.
name: baclr-qc
channels:
  - conda-forge
  - bioconda
dependencies:
  - python >=3.9,<3.12
  - quast >=5.2
  - pandas
