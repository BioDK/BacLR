# Environment for methylation motif discovery with NanoMotif (documented-only).
#   nanomotif - discovers methylated sequence motifs from a methylation pileup
#
# Split into its own file because Prokka + Bakta + NanoMotif together cannot
# be solved as a single conda environment. Used by the nanomotif_methylation
# rule, which is disabled by default - see docs/methylation_design.md.
#
# macOS note: on Apple Silicon, create with CONDA_SUBDIR=osx-64.
name: baclr-nanomotif
channels:
  - conda-forge
  - bioconda
dependencies:
  - python >=3.9
  - nanomotif
