# =============================================================================
# Configuration for the long-read bacterial genome reconstruction pipeline
# =============================================================================
# Edit the values below to point the workflow at your dataset and to tune
# each step. Every value here is read by the Snakefile via config["..."].
# Keeping parameters in one file (instead of hard-coding them in rules) is a
# core reproducibility practice: the workflow logic and its settings stay
# separate, so re-running an analysis with different settings is a one-line
# change with a full record of what was used.
# -----------------------------------------------------------------------------

# --- Sample identity ---------------------------------------------------------
# A short label used in output filenames. Keep it filesystem-safe (no spaces).
sample: "sample"

# --- Input data --------------------------------------------------------------
# Path to the raw Oxford Nanopore reads (FASTQ, gzipped is fine).
# This file lives under data/raw/ and is git-ignored (do not commit raw reads).
raw_reads: "data/raw/sample.fastq.gz"

# --- Expected genome size ----------------------------------------------------
# Flye uses this as a hint, not a hard constraint. Set it to the approximate
# genome size of your organism. Examples:
#   Escherichia coli       ~4.6m
#   Lactococcus lactis     ~2.5m
#   Bacillus subtilis      ~4.2m
# Update this AFTER you have chosen your dataset (see data/README.md).
genome_size: "4.6m"

# --- Compute -----------------------------------------------------------------
# Number of CPU threads available to multi-threaded rules.
threads: 8

# --- Read filtering (chopper) ------------------------------------------------
# quality_cutoff: minimum mean Phred quality per read. Q10 = ~90% base accuracy.
# min_length:     discard reads shorter than this (bp). Long-read assembly
#                 benefits from longer reads; very short reads add little.
# Do not over-filter: removing too much data lowers coverage and hurts assembly.
quality_cutoff: 10
min_length: 1000

# --- Flye assembly mode ------------------------------------------------------
# Choose based on how the reads were basecalled:
#   "--nano-raw"  older basecalling / higher error (R9.4 Guppy "fast")
#   "--nano-hq"   modern high-accuracy basecalling (R10.4 or Guppy "sup")
# When unsure, "--nano-hq" is the safer default for recent ONT datasets.
flye_mode: "--nano-hq"

# =============================================================================
# Optional / extended modules
# =============================================================================
# Each tool below is gated by a boolean. When false, its rule is not added to
# the workflow target list, so `snakemake` will not attempt to run it.
# This keeps the core pipeline runnable on a laptop while documenting the
# heavier steps. See docs/tool_principles.md for what each tool does.

# --- Extended: run if the conda environments install cleanly -----------------
# CheckM2: genome completeness & contamination (~3 GB database).
run_checkm: false
# Bakta: richer functional annotation than Prokka (light DB ~3 GB unpacked).
run_bakta: false

# --- Documented only: keep false unless you have the databases/data ----------
# GTDB-Tk: standardized taxonomy. Reference database is ~110 GB - not intended
# to be run in the one-day sprint. See docs/tool_principles.md for how it works.
run_gtdbtk: false
# NanoMotif: methylation motif discovery. Requires modification-aware
# basecalled data (modBAM), NOT plain FASTQ. See docs/methylation_design.md.
run_nanomotif: false

# --- Database paths (only used when the matching module is enabled) ----------
checkm2_db: "db/checkm2"
bakta_db: "db/bakta_light"
gtdbtk_db: "db/gtdbtk"
